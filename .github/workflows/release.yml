name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: excamera-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows x64
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out tagged source and full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate tag and derive build identity
        id: release
        shell: pwsh
        run: python tools/release.py prepare

      - name: Check generated compatibility tables
        shell: pwsh
        run: python tools/check_generated.py

      # build.py initializes x64 MSVC and checks DLL exports.
      # The CI checks need only source and Python, never a game executable.
      - name: Build and package
        shell: pwsh
        run: python build.py --package

      - name: Verify tagged runtime ZIP
        shell: pwsh
        run: python tools/release.py verify

      - name: Generate commit-based release notes
        shell: pwsh
        run: python tools/release.py notes

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release.outputs.asset }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Existing releases are never overwritten. A partial failure may leave a
      # draft; inspect it before rerunning. No PAT or automatic tag creation.
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          # Recheck the remote immediately before publication. --verify-tag alone
          # checks existence, not identity; stop if tag movement is detected.
          $remoteCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/refs/tags/$env:RELEASE_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($remoteCommit -cne $env:RELEASE_COMMIT) {
            throw "Remote release tag no longer matches the built commit; publication stopped."
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG, $env:RELEASE_ASSET, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "ExCamera $env:RELEASE_TAG", '--notes-file', 'build/release-notes.md')
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
