name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        run: python build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: ExCamera
          path: build/ExCamera-*.zip

  portable-tests:
    # The portable suites (math, signature resolution, hook health) need no Windows headers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pure-math suites
        working-directory: src
        run: |
          for t in test_camera_motion test_yaw_stabilization test_view_boundaries test_game_layout test_status_json; do
            g++ -std=c++17 -O2 "$t.cpp" -o "/tmp/$t" && "/tmp/$t"
          done
