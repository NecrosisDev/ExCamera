name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - 'tools/**'
      - 'LICENSE'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - 'tools/**'
      - 'LICENSE'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excamera-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Check generated compatibility tables
        shell: pwsh
        run: python tools/check_generated.py

      # build.py initializes x64 MSVC and checks DLL exports.
      # The CI checks need only source and Python, never a game executable.
      - name: Build and package
        shell: pwsh
        run: python build.py --package

      - name: Verify runtime ZIP
        shell: pwsh
        run: python tools/release.py verify --local

      - name: Upload release ZIP
        uses: actions/upload-artifact@v7
        with:
          path: build/ExCamera-*-minimal.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
